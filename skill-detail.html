<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Skill Detail - Campus Skill Exchange</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100">
  <header class="p-6 flex justify-between items-center">
    <h1 class="text-xl font-bold">Skill</h1>
    <a href="browse-skills.html" class="px-3 py-1 border rounded">Back</a>
  </header>

  <main class="max-w-3xl mx-auto p-6">
    <div class="bg-slate-800 p-6 rounded">
      <h2 id="title" class="text-2xl font-bold"></h2>
      <div id="meta" class="text-sm text-slate-400 mt-1"></div>
      <p id="desc" class="mt-4"></p>
      <div class="mt-6">
        <button id="messageBtn" class="bg-emerald-500 px-4 py-2 rounded text-slate-900">Message Author</button>
        <a id="contactLink" class="ml-4 text-amber-400"></a>
     <nav class="space-x-4">
      <a href="index.html" class="hover:underline">Home</a>
      <a href="login.html" class="bg-emerald-500 px-4 py-2 rounded text-slate-900 font-semibold">Login</a>
      <a href="register.html" class="hover:underline">register</a>
     <a href="dashboard.html" class="hover:underline">Dashboard</a>
      <a href="post-skill.html" class="hover:underline">post-skill</a>
     <a href="browse-skills.html" class="hover:underline">Browse Skills</a>
      <a href="skill-detail.html" class="hover:underline">skill-detail</a>
      <a href="profile.html" class="hover:underline">Profile</a>
      <a href="message.html" class="hover:underline">message</a>
      <a href="notifications.html" class="hover:underline">notifications</a>
      <a href="setting.html" class="hover:underline">setting</a>
      <a href="admin-dashboard.html" class="hover:underline">admin-dashboard</a>
      <a href="admin-users.html" class="hover:underline">admin-users</a>
      <a href="admin-skills.html" class="hover:underline">admin-skills</a>
      <a href="about.html" class="hover:underline">about</a>
      <a href="terms.html" class="hover:underline">terms</a>
    </nav>
</div>
    </div>
  </main>

  <script>
    // Firebase config - REPLACE
    const firebaseConfig = {
     apiKey: "AIzaSyB6z6HRLZm8UWQuQPDlEDIK2O5LDUYG0l4",
  authDomain: "backend-python-database.firebaseapp.com",
  databaseURL: "https://backend-python-database-default-rtdb.firebaseio.com",
  projectId: "backend-python-database",
  storageBucket: "backend-python-database.firebasestorage.app",
  messagingSenderId: "366124632220",
  appId: "1:366124632220:web:0245bc53207ff591fd8559",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    if (!id) location.href = 'browse-skills.html';

    db.ref('skills/' + id).on('value', snap => {
      const s = snap.val();
      if (!s) { document.getElementById('title').textContent = 'Not found'; return; }
      document.getElementById('title').textContent = s.title;
      document.getElementById('meta').textContent = `${s.category || 'General'} • by ${s.authorName || 'Unknown'}`;
      document.getElementById('desc').textContent = s.description || '';
      document.getElementById('contactLink').textContent = s.contact || '';
    });

    document.getElementById('messageBtn').addEventListener('click', async () => {
      const user = auth.currentUser;
      if (!user) return location.href = 'login.html';
      // Create or open a conversation in /conversations/{sortedUidPair}
      const skill = (await db.ref('skills/' + id).get()).val();
      if (!skill) return alert('Skill not found');
      const other = skill.authorId;
      if (other === user.uid) return alert('This is your own skill');
      const convId = [user.uid, other].sort().join('_');
      // Seed conversation metadata
      await db.ref('conversations/' + convId + '/meta').set({
        participants: { [user.uid]: true, [other]: true },
        skillId: id,
        lastAt: Date.now()
      });
      // Redirect to messages with convo
      location.href = 'messages.html?conv=' + convId;
    });
  </script>
</body>
</html>
