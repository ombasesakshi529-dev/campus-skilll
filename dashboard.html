<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>User Dashboard - Campus Skill Exchange</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100">
  <header class="p-6 flex justify-between items-center">
    <h1 class="text-xl font-bold">Dashboard</h1>
    <div class="space-x-3">
      <a href="post-skill.html" class="bg-emerald-500 px-3 py-1 rounded text-slate-900">Post Skill</a>
      <button id="logoutBtn" class="px-3 py-1 border rounded">Logout</button>
    </div>
  </header>

  <main class="p-6 max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
    <aside class="md:col-span-1 bg-slate-800 p-4 rounded">
      <div id="profileBox">
        <!-- Filled by JS -->
      </div>
     <nav class="space-x-4">
      <a href="index.html" class="hover:underline">Home</a>
      <a href="login.html" class="bg-emerald-500 px-4 py-2 rounded text-slate-900 font-semibold">Login</a>
      <a href="register.html" class="hover:underline">register</a>
     <a href="dashboard.html" class="hover:underline">Dashboard</a>
      <a href="post-skill.html" class="hover:underline">post-skill</a>
     <a href="browse-skills.html" class="hover:underline">Browse Skills</a>
      <a href="skill-detail.html" class="hover:underline">skill-detail</a>
      <a href="profile.html" class="hover:underline">Profile</a>
      <a href="message.html" class="hover:underline">message</a>
      <a href="notifications.html" class="hover:underline">notifications</a>
      <a href="setting.html" class="hover:underline">setting</a>
      <a href="admin-dashboard.html" class="hover:underline">admin-dashboard</a>
      <a href="admin-users.html" class="hover:underline">admin-users</a>
      <a href="admin-skills.html" class="hover:underline">admin-skills</a>
      <a href="about.html" class="hover:underline">about</a>
      <a href="terms.html" class="hover:underline">terms</a>
    </nav>
    </aside>

    <section class="md:col-span-2 space-y-4">
      <div class="bg-slate-800 p-4 rounded">
        <h2 class="font-semibold text-lg">Recommended for you</h2>
        <div id="recommendations" class="mt-3 space-y-3"></div>
      </div>

      <div class="bg-slate-800 p-4 rounded">
        <h2 class="font-semibold text-lg">Your Posted Skills</h2>
        <div id="mySkills" class="mt-3 space-y-3"></div>
      </div>
    </section>
  </main>

  <script>
    // Firebase config - REPLACE
    const firebaseConfig = {
     apiKey: "AIzaSyB6z6HRLZm8UWQuQPDlEDIK2O5LDUYG0l4",
  authDomain: "backend-python-database.firebaseapp.com",
  databaseURL: "https://backend-python-database-default-rtdb.firebaseio.com",
  projectId: "backend-python-database",
  storageBucket: "backend-python-database.firebasestorage.app",
  messagingSenderId: "366124632220",
  appId: "1:366124632220:web:0245bc53207ff591fd8559",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const profileBox = document.getElementById('profileBox');
    const rec = document.getElementById('recommendations');
    const mySkills = document.getElementById('mySkills');
    const logoutBtn = document.getElementById('logoutBtn');

    logoutBtn.addEventListener('click', () => auth.signOut().then(() => location.href='index.html'));

    auth.onAuthStateChanged(async user => {
      if (!user) return location.href = 'login.html';
      const uid = user.uid;
      const snap = await db.ref('users/' + uid).get();
      const profile = snap.val() || {};
      profileBox.innerHTML = `<div class="font-bold">${escapeHtml(profile.name || 'User')}</div>
        <div class="text-sm text-slate-400">${escapeHtml(profile.email || user.email)}</div>`;
      // Load user's posted skills
      db.ref('skills').orderByChild('authorId').equalTo(uid).on('value', s => {
        renderMySkills(s.val() || {});
      });
      // Load recommended (sample: latest 6)
      db.ref('skills').orderByChild('createdAt').limitToLast(6).on('value', s => {
        rec.innerHTML = '';
        const data = s.val();
        if (!data) rec.innerHTML = '<div class="text-slate-400">No skills yet.</div>';
        else Object.entries(data).reverse().forEach(([id, skill]) => {
          const el = document.createElement('div'); el.className='p-3 rounded bg-slate-900 flex justify-between items-start';
          el.innerHTML = `<div><div class="font-semibold">${escapeHtml(skill.title)}</div><div class="text-sm text-slate-400">${escapeHtml(skill.category || '')}</div></div>
            <a href="skill-detail.html?id=${id}" class="text-emerald-400">View</a>`;
          rec.appendChild(el);
        });
      });
    });

    function renderMySkills(skillsObj) {
      mySkills.innerHTML = '';
      if (!Object.keys(skillsObj).length) mySkills.innerHTML = '<div class="text-slate-400">You have not posted any skills.</div>';
      Object.entries(skillsObj).reverse().forEach(([id, s]) => {
        const el = document.createElement('div'); el.className='p-3 rounded bg-slate-900 flex justify-between items-center';
        el.innerHTML = `<div>
            <div class="font-semibold">${escapeHtml(s.title)}</div>
            <div class="text-sm text-slate-400">${escapeHtml(s.category || '')}</div>
          </div>
          <div class="space-x-2">
            <a class="text-amber-400" href="skill-detail.html?id=${id}">View</a>
            <button class="text-rose-400" onclick="deleteSkill('${id}')">Delete</button>
          </div>`;
        mySkills.appendChild(el);
      });
    }

    async function deleteSkill(id) {
      if (!confirm('Delete this skill?')) return;
      await db.ref('skills/' + id).remove();
      alert('Deleted');
    }

    function escapeHtml(s='') { return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
  </script>
</body>
</html>
