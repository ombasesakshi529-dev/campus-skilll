<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register - Campus Skill Exchange</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-900 text-slate-100">
  <div class="max-w-lg w-full bg-slate-800 p-8 rounded">
    <h2 class="text-2xl font-bold mb-4">Create an account</h2>
    <form id="regForm" class="space-y-4">
      <div><label class="block text-sm">Full name</label><input id="name" required class="w-full mt-1 p-2 rounded bg-slate-900" /></div>
      <div><label class="block text-sm">Email</label><input id="email" type="email" required class="w-full mt-1 p-2 rounded bg-slate-900" /></div>
      <div><label class="block text-sm">Password</label><input id="password" type="password" required class="w-full mt-1 p-2 rounded bg-slate-900" /></div>
      <div class="flex justify-between items-center">
        <button class="bg-emerald-500 px-4 py-2 rounded text-slate-900 font-semibold">Register</button>
        <a href="login.html" class="text-slate-300">Already have an account?</a>
   <nav class="space-x-4">
      <a href="index.html" class="hover:underline">Home</a>
      <a href="login.html" class="bg-emerald-500 px-4 py-2 rounded text-slate-900 font-semibold">Login</a>
      <a href="register.html" class="hover:underline">register</a>
     <a href="dashboard.html" class="hover:underline">Dashboard</a>
      <a href="post-skill.html" class="hover:underline">post-skill</a>
     <a href="browse-skills.html" class="hover:underline">Browse Skills</a>
      <a href="skill-detail.html" class="hover:underline">skill-detail</a>
      <a href="profile.html" class="hover:underline">Profile</a>
      <a href="message.html" class="hover:underline">message</a>
      <a href="notifications.html" class="hover:underline">notifications</a>
      <a href="setting.html" class="hover:underline">setting</a>
      <a href="admin-dashboard.html" class="hover:underline">admin-dashboard</a>
      <a href="admin-users.html" class="hover:underline">admin-users</a>
      <a href="admin-skills.html" class="hover:underline">admin-skills</a>
      <a href="about.html" class="hover:underline">about</a>
      <a href="terms.html" class="hover:underline">terms</a>
    </nav>
 </div>
    </form>
    <p id="msg" class="mt-3 text-sm"></p>
  </div>

  <script>
    // Firebase config - REPLACE
    const firebaseConfig = {
     apiKey: "AIzaSyB6z6HRLZm8UWQuQPDlEDIK2O5LDUYG0l4",
  authDomain: "backend-python-database.firebaseapp.com",
  databaseURL: "https://backend-python-database-default-rtdb.firebaseio.com",
  projectId: "backend-python-database",
  storageBucket: "backend-python-database.firebasestorage.app",
  messagingSenderId: "366124632220",
  appId: "1:366124632220:web:0245bc53207ff591fd8559",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    document.getElementById('regForm').addEventListener('submit', async e => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        const uid = cred.user.uid;
        // Save profile to Realtime DB with default role student
        await db.ref('users/' + uid).set({
          name,
          email,
          role: 'student',
          createdAt: Date.now()
        });
        document.getElementById('msg').textContent = 'Registered. Redirecting...';
        setTimeout(() => window.location.href = 'dashboard.html', 900);
      } catch (err) {
        document.getElementById('msg').textContent = err.message;
      }
    });
  </script>
</body>
</html>
