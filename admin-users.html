<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - Users - Campus Skill Exchange</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100">
  <header class="p-6 flex justify-between items-center">
    <h1 class="text-xl font-bold">Manage Users</h1>
    <a href="admin-dashboard.html" class="px-3 py-1 border rounded">Back</a>
  </header>
  <main class="p-6 max-w-6xl mx-auto">
    <div class="bg-slate-800 p-4 rounded">
      <h2 class="font-semibold">All Users</h2>
      <div id="usersList" class="mt-3 space-y-2"></div>
<nav class="space-x-4">
      <a href="index.html" class="hover:underline">Home</a>
      <a href="login.html" class="bg-emerald-500 px-4 py-2 rounded text-slate-900 font-semibold">Login</a>
      <a href="register.html" class="hover:underline">register</a>
      <a href="dashboard.html" "hover:underline">dashboard</a>
      <a href="post-skill.html" class="hover:underline">post-skill</a>
      <a href="browser-skills.html" class="hover:underline">browser-skills</a>
      <a href="skill-detail.html" class="hover:underline">skill-detail</a>
      <a href=profile.html" class="hover:underline">profile</a>
      <a href="message.html" class="hover:underline">message</a>
      <a href="notifications.html" class="hover:underline">notifications</a>
      <a href="setting.html" class="hover:underline">setting</a>
      <a href="admin-dashboard.html" class="hover:underline">admin-dashboard</a>
      <a href="admin-users.html" class="hover:underline">admin-users</a>
      <a href="admin-skills.html" class="hover:underline">admin-skills</a>
      <a href="about.html" class="hover:underline">about</a>
      <a href="terms.html" class="hover:underline">terms</a>
    </nav>
    </div>
  </main>

  <script>
    // Firebase config - REPLACE
    const firebaseConfig = {
     apiKey: "AIzaSyB6z6HRLZm8UWQuQPDlEDIK2O5LDUYG0l4",
  authDomain: "backend-python-database.firebaseapp.com",
  databaseURL: "https://backend-python-database-default-rtdb.firebaseio.com",
  projectId: "backend-python-database",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    auth.onAuthStateChanged(async user=>{
      if(!user) return location.href='login.html';
      const roleSnap = await db.ref('users/' + user.uid + '/role').get();
      if (!roleSnap.exists() || roleSnap.val() !== 'admin') return alert('Not authorized') && location.href='login.html';
      db.ref('users').on('value', snap => renderUsers(snap.val() || {}));
    });

    function renderUsers(users) {
      const list = document.getElementById('usersList');
      list.innerHTML = '';
      Object.entries(users).forEach(([uid, u]) => {
        const div = document.createElement('div');
        div.className = 'p-3 rounded bg-slate-900 flex justify-between items-center';
        div.innerHTML = `<div><div class="font-semibold">${escapeHtml(u.name || '')}</div><div class="text-sm text-slate-400">${escapeHtml(u.email || '')}</div></div>
          <div class="space-x-2">
            <button onclick="setRole('${uid}','admin')" class="px-2 py-1 bg-amber-500 rounded">Make Admin</button>
            <button onclick="setRole('${uid}','student')" class="px-2 py-1 bg-emerald-500 rounded">Make User</button>
            <button onclick="removeUser('${uid}')" class="px-2 py-1 bg-rose-500 rounded">Delete</button>
          </div>`;
        list.appendChild(div);
      });
    }

    async function setRole(uid, role) {
      if (!confirm(`Set role = ${role} for ${uid}?`)) return;
      await db.ref('users/' + uid + '/role').set(role);
      alert('Updated');
    }
    async function removeUser(uid) {
      if (!confirm('Delete user and their profile?')) return;
      await db.ref('users/' + uid).remove();
      alert('Deleted');
    }

    function escapeHtml(s='') { return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
  </script>
</body>
</html>
