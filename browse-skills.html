<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Browse Skills - Campus Skill Exchange</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100">
  <header class="p-6 flex justify-between items-center">
    <h1 class="text-xl font-bold">Browse Skills</h1>
    <div>
      <nav class="space-x-4">
      <a href="index.html" class="hover:underline">Home</a>
      <a href="login.html" class="bg-emerald-500 px-4 py-2 rounded text-slate-900 font-semibold">Login</a>
      <a href="register.html" class="hover:underline">register</a>
      <a href="dashboard.html" "hover:underline">dashboard</a>
      <a href="post-skill.html" class="hover:underline">post-skill</a>
      <a href="browser-skills.html" class="hover:underline">browser-skills</a>
      <a href="skill-detail.html" class="hover:underline">skill-detail</a>
      <a href=profile.html" class="hover:underline">profile</a>
      <a href="message.html" class="hover:underline">message</a>
      <a href="notifications.html" class="hover:underline">notifications</a>
      <a href="setting.html" class="hover:underline">setting</a>
      <a href="admin-dashboard.html" class="hover:underline">admin-dashboard</a>
      <a href="admin-users.html" class="hover:underline">admin-users</a>
      <a href="admin-skills.html" class="hover:underline">admin-skills</a>
      <a href="about.html" class="hover:underline">about</a>
      <a href="terms.html" class="hover:underline">terms</a>
    </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6">
    <div class="mb-4">
      <input id="search" placeholder="Search by title or category" class="w-full p-3 rounded bg-slate-800" />
    </div>
    <div id="list" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
  </main>

  <script>
    // Firebase config - REPLACE
    const firebaseConfig = {
      apiKey: "AIzaSyB6z6HRLZm8UWQuQPDlEDIK2O5LDUYG0l4",
  authDomain: "backend-python-database.firebaseapp.com",
  databaseURL: "https://backend-python-database-default-rtdb.firebaseio.com",
  projectId: "backend-python-database",
  storageBucket: "backend-python-database.firebasestorage.app",
  messagingSenderId: "366124632220",
  appId: "1:366124632220:web:0245bc53207ff591fd8559",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const list = document.getElementById('list');
    db.ref('skills').orderByChild('createdAt').on('value', snapshot => {
      const data = snapshot.val() || {};
      render(Object.entries(data).reverse());
    });

    document.getElementById('search').addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      db.ref('skills').orderByChild('createdAt').limitToLast(100).once('value').then(snap => {
        const data = snap.val() || {};
        const arr = Object.entries(data).reverse().filter(([id, skill]) => {
          return (skill.title || '').toLowerCase().includes(q) || (skill.category || '').toLowerCase().includes(q);
        });
        render(arr);
      });
    });

    function render(items) {
      list.innerHTML = '';
      if (!items.length) { list.innerHTML = '<div class="text-slate-400">No skills found.</div>'; return; }
      items.forEach(([id, s]) => {
        const el = document.createElement('div');
        el.className = 'p-4 rounded bg-slate-800';
        el.innerHTML = `<div class="font-semibold text-lg">${escapeHtml(s.title)}</div>
          <div class="text-sm text-slate-400">${escapeHtml(s.category || '')}</div>
          <p class="mt-2 text-slate-200 text-sm">${escapeHtml(s.description || '').slice(0,140)}${(s.description||'').length>140? '...':''}</p>
          <div class="mt-3 flex justify-between items-center">
            <a href="skill-detail.html?id=${id}" class="text-emerald-400">View</a>
            <div class="text-sm text-slate-400">by ${escapeHtml(s.authorName || 'Unknown')}</div>
          </div>`;
        list.appendChild(el);
      });
    }

    function escapeHtml(s='') { return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
  </script>
</body>
</html>
