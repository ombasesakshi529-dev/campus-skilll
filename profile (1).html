<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile - Campus Skill Exchange</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100">
  <header class="p-6 flex justify-between items-center">
    <h1 class="text-xl font-bold">My Profile</h1>
    <a href="dashboard.html" class="px-3 py-1 border rounded">Back</a>
  </header>

  <main class="max-w-3xl mx-auto p-6">
    <div class="bg-slate-800 p-6 rounded">
      <form id="profileForm" class="space-y-4">
        <div><label class="text-sm">Full name</label><input id="name" class="w-full mt-1 p-2 rounded bg-slate-900"></div>
        <div><label class="text-sm">Bio</label><textarea id="bio" rows="4" class="w-full mt-1 p-2 rounded bg-slate-900"></textarea></div>
        <div class="flex justify-end"><button class="bg-emerald-500 px-4 py-2 rounded text-slate-900">Save</button></div>
      </form>
      <p id="msg" class="mt-3 text-sm"></p>
  <nav class="space-x-4">
      <a href="index.html" class="hover:underline">Home</a>
      <a href="login.html" class="bg-emerald-500 px-4 py-2 rounded text-slate-900 font-semibold">Login</a>
      <a href="register.html" class="hover:underline">register</a>
      <a href="dashboard.html" "hover:underline">dashboard</a>
      <a href="post-skill.html" class="hover:underline">post-skill</a>
      <a href="browser-skills.html" class="hover:underline">browser-skills</a>
      <a href="skill-detail.html" class="hover:underline">skill-detail</a>
      <a href=profile.html" class="hover:underline">profile</a>
      <a href="message.html" class="hover:underline">message</a>
      <a href="notifications.html" class="hover:underline">notifications</a>
      <a href="setting.html" class="hover:underline">setting</a>
      <a href="admin-dashboard.html" class="hover:underline">admin-dashboard</a>
      <a href="admin-users.html" class="hover:underline">admin-users</a>
      <a href="admin-skills.html" class="hover:underline">admin-skills</a>
      <a href="about.html" class="hover:underline">about</a>
      <a href="terms.html" class="hover:underline">terms</a>
    </nav> 
 </div>
  </main>

  <script>
    // Firebase config - REPLACE
    const firebaseConfig = {
     apiKey: "AIzaSyB6z6HRLZm8UWQuQPDlEDIK2O5LDUYG0l4",
  authDomain: "backend-python-database.firebaseapp.com",
  databaseURL: "https://backend-python-database-default-rtdb.firebaseio.com",
  projectId: "backend-python-database",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    auth.onAuthStateChanged(async user => {
      if (!user) return location.href='login.html';
      const snap = await db.ref('users/' + user.uid).get();
      const profile = snap.val() || {};
      document.getElementById('name').value = profile.name || user.email;
      document.getElementById('bio').value = profile.bio || '';
    });

    document.getElementById('profileForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const user = auth.currentUser;
      if(!user) return location.href='login.html';
      await db.ref('users/' + user.uid).update({
        name: document.getElementById('name').value.trim(),
        bio: document.getElementById('bio').value.trim(),
      });
      document.getElementById('msg').textContent = 'Saved';
    });
  </script>
</body>
</html>
