    <div id="notes" class="space-y-3 bg-slate-800 p-4 rounded"></div>
  </main>

  <script>
    // Firebase config - REPLACE
    const firebaseConfig = {
      apiKey: "AIzaSyB6z6HRLZm8UWQuQPDlEDIK2O5LDUYG0l4",
  authDomain: "backend-python-database.firebaseapp.com",
  databaseURL: "https://backend-python-database-default-rtdb.firebaseio.com",
  projectId: "backend-python-database",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    auth.onAuthStateChanged(user=>{
      if (!user) return location.href='login.html';
      db.ref('notifications/' + user.uid).on('value', snap => {
        const data = snap.val() || {};
        const notes = document.getElementById('notes');
        notes.innerHTML = '';
        Object.entries(data).reverse().forEach(([id, n]) => {
          const el = document.createElement('div'); el.className='p-3 rounded bg-slate-900';
          el.innerHTML = `<div class="text-sm text-slate-400">${new Date(n.at).toLocaleString()}</div><div>${escapeHtml(n.text)}</div>`;
          notes.appendChild(el);
        });
      });
    });

    function escapeHtml(s='') { return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
  </script>
</body>
</html>
